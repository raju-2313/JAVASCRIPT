<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Currency Converter</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer">
</head>

<body>

    <div class="container">

        <h1>Currency Convertor</h1>

        <form>

            <div class="amount">
                <p>Enter amount</p>
                <input value="1" type="text">
            </div>

            <div class="dropdown">

                <div class="from">

                    <p>From</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/US/shiny/64.png" alt="USA flag">
                        <select name="from">
                        </select>
                    </div>
                </div>


                <i class="fa-solid fa-arrow-right-arrow-left" id="icon"></i>


                <div class="to">

                    <p>To</p>
                <div class="select-container">
                    <img src="https://flagsapi.com/IN/shiny/64.png" alt="India flag">
                    <select name="to">
                    </select>
                </div>

                </div>

            </div>

            <div class="msg">
                1 USD = 95.72 INR
            </div>

            <button type="submit">
                Get Exchange Rate
            </button>

        </form>
    </div>

    <script src="codes.js"></script>
    <script src="app.js"></script>

</body>

</html>
